name: AWS OIDC Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc:
    name: Test AWS OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            iss, aud, sub, repository, repository_owner, ref
          }'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::287785301730:role/AWS-Github-OIDC
          role-session-name: oidc-test-${{ github.run_id }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
